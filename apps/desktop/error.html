<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vaporzr — not connected</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #1a2050, #0b1026 60%);
        color: #e8e9f5;
        font:
          15px/1.6 system-ui,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
        color: #a9adc9;
      }
      code {
        font-family: ui-monospace, Consolas, monospace;
        color: #cfd3ee;
        word-break: break-all;
      }
      .row {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 1.5rem;
      }
      a.button {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        background: #6a5cff;
        color: #fff;
      }
      a.secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #e8e9f5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can’t reach the Vaporzr panel</h1>
      <p>
        The bot may be restarting, or this machine may be offline. Playback in Discord keeps running either way — this
        window only controls it.
      </p>
      <p><code id="url"></code></p>
      <p id="reason"></p>
      <div class="row">
        <a class="button" id="retry" href="#">Try again</a>
        <a class="button secondary" id="browser" href="#">Open in browser</a>
      </div>
    </main>
    <script>
      var params = new URLSearchParams(location.search);
      var url = params.get('url') || 'https://www.vaporzr.app/panel';
      var reason = params.get('reason') || '';
      document.getElementById('url').textContent = url;
      if (reason) document.getElementById('reason').textContent = reason;
      var retry = document.getElementById('retry');
      retry.href = url;
      retry.onclick = function (e) {
        e.preventDefault();
        location.replace(url);
      };
      var browser = document.getElementById('browser');
      browser.href = url;
      browser.onclick = function (e) {
        e.preventDefault();
        // Same origin as the shell's target, so the main process treats this as
        // an in-app navigation and the link would just come straight back here.
        // window.open is intercepted and handed to the system browser instead.
        window.open(url, '_blank');
      };
    </script>
  </body>
</html>
