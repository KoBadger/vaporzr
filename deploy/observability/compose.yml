name: vaporzr-observability

# Free/self-hosted add-ons. Keep these off the public internet (or behind the
# same reverse proxy with auth) — they read logs/metrics and are not hardened
# for direct exposure.
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - uptime-kuma:/app/data

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  beszel:
    image: henrygd/beszel:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8090:8090'
    volumes:
      - beszel-data:/beszel_data

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD}
    volumes:
      - umami-db:/var/lib/postgresql/data

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      - umami-db
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  uptime-kuma:
  beszel-data:
  umami-db:
