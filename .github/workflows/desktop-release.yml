name: Desktop release

# Tag `desktop-v0.1.0` to publish a portable Windows build of the control-panel
# window plus its SHA-256. Manual runs upload the same zip as a workflow
# artifact without touching a release, which is the dry-run path.
#
# The panel window has no npm dependencies — it loads the live `/panel` page —
# so this job never runs `npm ci`. The only download is the Electron runtime,
# verified against the checksum pinned here.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

env:
  ELECTRON_VERSION: '33.4.11'
  ELECTRON_SHA256: 'f64c8a5a81d9b420b636fdba13e180f49d69f2198e1d86a8b01f858b17a9483c'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download Electron runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'electron.zip'
          $url = "https://github.com/electron/electron/releases/download/v$env:ELECTRON_VERSION/electron-v$env:ELECTRON_VERSION-win32-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:ELECTRON_SHA256) {
            throw "Electron checksum mismatch: $got"
          }
          Expand-Archive -Path $zip -DestinationPath vendor/electron/dist -Force

      - name: Stage portable build
        run: node scripts/pack-desktop.mjs --platform win32 --arch x64

      - name: Zip and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = 'dist/Vaporzr-Panel-win32-x64.zip'
          # Compress the *contents*, not the folder, so extracting gives you
          # "Vaporzr Panel.exe" instead of one more directory to click through.
          Compress-Archive -Path apps/desktop/release/Vaporzr-Panel-win32-x64/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Vaporzr-Panel-win32-x64.zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: Vaporzr-Panel-win32-x64
          path: |
            dist/Vaporzr-Panel-win32-x64.zip
            dist/Vaporzr-Panel-win32-x64.zip.sha256

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/Vaporzr-Panel-win32-x64.zip dist/Vaporzr-Panel-win32-x64.zip.sha256 --clobber
          } else {
            gh release create $tag dist/Vaporzr-Panel-win32-x64.zip dist/Vaporzr-Panel-win32-x64.zip.sha256 `
              --title "Vaporzr panel $tag" --generate-notes
          }
