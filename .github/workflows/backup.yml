name: Backup

# Secondary encrypted copy of the vaporzr-data volume, pulled by a GitHub runner
# over SSH. The archive is encrypted on the VPS before it goes anywhere (the
# repo is public), stored as a workflow artifact, and kept as rotated encrypted
# copies on the VPS itself.
#
# This is NOT the primary backup: it needs inbound SSH from GitHub's runner IPs,
# which fail2ban and the Hetzner firewall both tend to block (every run between
# 2026-10-18 and 2026-11-15 died at `dial tcp …:22` with no artifact). The
# primary path is the VPS pushing with restic — see deploy/backup-offsite.sh and
# docs/BACKUPS.md — and /health reports its age as `backup.stale`.
on:
  schedule:
    # Sundays 09:00 UTC (2 AM US Pacific).
    - cron: '0 9 * * 0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Deterministic per-run name so the download step knows what to fetch.
  BACKUP_NAME: vaporzr-data-${{ github.run_id }}.tgz.enc

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - name: Archive + encrypt the data volume on the VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 180
          retry_count: 2
          insecure_ignore_known_hosts: false
          envs: BACKUP_NAME
          script: |
            set -e
            DATA=/var/lib/docker/volumes/vaporzr-data/_data
            DEST=/opt/vaporzr/backups
            ARCHIVE="$DEST/$BACKUP_NAME"
            mkdir -p "$DEST"
            # Rebuildable caches (go-librespot/cache ~1 GB, stems, hf, torch) are
            # excluded; uploads, presets, suno, queues, tokens and cookies stay.
            tar -czf "${ARCHIVE%.enc}" -C "$DATA" \
              --exclude='go-librespot/cache' \
              --exclude='stems' \
              --exclude='hf' \
              --exclude='torch' \
              .
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -pass file:/opt/vaporzr/backup-passphrase.txt \
              -in "${ARCHIVE%.enc}" -out "$ARCHIVE"
            rm -f "${ARCHIVE%.enc}"
            ls -lh "$ARCHIVE"
            # Rotate: keep the 4 newest encrypted copies on the VPS.
            ls -1t "$DEST"/vaporzr-data-*.tgz.enc | tail -n +5 | xargs -r rm -f

      - name: Download the encrypted archive
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 600 /dev/null vps_key
          printf '%s\n' "$VPS_SSH_KEY" > vps_key
          scp -i vps_key -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST:/opt/vaporzr/backups/$BACKUP_NAME" "$BACKUP_NAME"
          ls -lh "$BACKUP_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: backup-${{ github.run_id }}
          path: ${{ env.BACKUP_NAME }}
          retention-days: 90
