name: Deploy

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sha:
        description: 'Image tag to deploy (rollback: a previous build sha — short shas resolve automatically; leave blank to build and deploy master)'
        required: false
        default: ''

# Serialize deploys: two master pushes in quick succession must not race on the
# VPS (whichever SSH script runs last wins, and an older run finishing later
# would leave prod on the older image).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kobadger/vaporzr/vaporzr-bot
  LIBRESPOT_VERSION: v0.8.0
  # Opt into the Node 24 action runtime now (GitHub is forcing it anyway) so the
  # deprecated-Node-20 warnings stop.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # What gets deployed: a rollback dispatch input when present, else this run's sha.
  DEPLOY_SHA: ${{ github.event.inputs.sha || github.sha }}

jobs:
  build-and-push:
    # A rollback dispatch (sha input given) skips the build — that image tag already exists.
    if: ${{ !github.event.inputs.sha }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo (librespot)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: librespot-${{ env.LIBRESPOT_VERSION }}-${{ runner.os }}

      - name: Build librespot for linux
        # The Dockerfile does `COPY librespot /usr/local/bin/librespot`. The
        # binary is gitignored (it's a large vendored blob). Upstream ships no
        # prebuilt binaries, so compile the pinned tag from source. As of 0.8.0
        # the pipe + subprocess backends are built unconditionally (not
        # feature-gated), so we trim the build to rustls TLS + libmdns which is
        # all the bot needs for its subprocess/pipe bridge.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          export PATH="$HOME/.cargo/bin:$PATH"
          # Keep the (cached) build output outside the throwaway clone.
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/.cargo-target"
          git clone https://github.com/librespot-org/librespot.git
          cd librespot
          git fetch --depth 1 origin "refs/tags/$LIBRESPOT_VERSION:refs/tags/$LIBRESPOT_VERSION"
          git checkout "$LIBRESPOT_VERSION"
          cargo build --release --bin librespot \
            --no-default-features \
            --features "rustls-tls-webpki-roots,with-libmdns"
          cd ..
          rm -rf librespot
          cp "$CARGO_TARGET_DIR/release/librespot" ./librespot
          test -x librespot && ./librespot --version | head -1
          timeout 3 ./librespot --backend ? 2>&1 | grep -E 'pipe|subprocess' || true
        env:
          LIBRESPOT_VERSION: ${{ env.LIBRESPOT_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/bot/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-24.04
    # Push/tag deploys as before; a rollback dispatch runs with the build job
    # skipped, so `always()` keeps this job from being skipped along with it.
    if: |
      always() &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    environment: production
    steps:
      - name: Resolve rollback sha
        id: sha
        # /health reports a 7-char build sha; accept short shas by resolving them
        # to the full commit sha the image tag was built from.
        if: github.event.inputs.sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.inputs.sha }}"
          if [ "${#SHA}" -lt 40 ]; then
            SHA=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq .sha)
            echo "Resolved short sha ${{ github.event.inputs.sha }} -> $SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            SHA="${{ steps.sha.outputs.sha || env.DEPLOY_SHA }}"
            echo "Deploying ${{ env.IMAGE }}:$SHA"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Abort before touching the running container if the tag does not exist
            # (a typo'd rollback sha changes nothing).
            docker pull ${{ env.IMAGE }}:$SHA || {
              echo "ERROR: ${{ env.IMAGE }}:$SHA not found in GHCR — nothing was changed."; exit 1; }

            # YouTube PO-token provider (host loopback :4416). Persists across
            # deploys; start it here if the VPS was rebuilt from scratch.
            if ! docker container inspect bgutil-provider >/dev/null 2>&1; then
              docker run -d --name bgutil-provider --init --restart unless-stopped \
                --network host brainicism/bgutil-ytdlp-pot-provider
            fi

            docker volume inspect vaporzr-data >/dev/null 2>&1 || docker volume create vaporzr-data

            # Mount YouTube cookies read-only when the host provides them.
            COOKIE_MOUNT=""
            if [ -f /opt/vaporzr/cookies.txt ]; then
              COOKIE_MOUNT="-v /opt/vaporzr/cookies.txt:/app/data/cookies.txt:ro"
            fi

            # Smoke-test the freshly built image BEFORE touching the running
            # container, so a broken build aborts here and prod keeps serving.
            docker run --rm ${{ env.IMAGE }}:$SHA \
              sh -c "cd /app/apps/bot && tsx smoke-persist.ts"

            # Remember the image currently serving traffic so a failed health
            # gate can restore it without a manual rollback dispatch.
            PREV_IMAGE=$(docker inspect -f '{{.Config.Image}}' vaporzr 2>/dev/null || true)

            start_container() {
              docker run -d --name vaporzr \
                --restart unless-stopped \
                --network host \
                --env-file /opt/vaporzr/.env \
                -e BIND_ADDRESS=127.0.0.1 \
                -v vaporzr-data:/app/data \
                $COOKIE_MOUNT \
                "$1"
            }

            docker stop vaporzr || true
            docker rm vaporzr || true
            start_container ${{ env.IMAGE }}:$SHA
            docker image prune -f
            # Keep the 6 newest bot images (current + a few rollback targets);
            # the VPS disk fills fast at ~1.4 GB per tag otherwise.
            docker images --format '{{.ID}} {{.CreatedAt}}' ${{ env.IMAGE }} \
              | sort -k2 -r | tail -n +7 | awk '{print $1}' | sort -u \
              | xargs -r docker rmi -f >/dev/null 2>&1 || true
            # Health gate: the container needs a few seconds to log in and bind.
            # Require a 200 from /health within 60s, else restore the previous
            # image and fail the run — a broken deploy is never left serving.
            HEALTH_CMD="const h=require('http');h.get('http://127.0.0.1:'+(process.env.PORT||4876)+'/health',s=>{let b='';s.on('data',d=>b+=d);s.on('end',()=>{console.log('health:',b);process.exit(s.statusCode===200?0:1)})}).on('error',()=>process.exit(1))"
            healthy=0
            for _ in $(seq 1 30); do
              sleep 2
              if docker exec vaporzr node -e "$HEALTH_CMD" >/dev/null 2>&1; then healthy=1; break; fi
            done
            if [ "$healthy" -ne 1 ]; then
              echo "ERROR: /health did not answer 200 within 60s — rolling back."
              docker logs --tail 100 vaporzr || true
              docker rm -f vaporzr || true
              if [ -n "$PREV_IMAGE" ]; then
                start_container "$PREV_IMAGE"
                echo "Rolled back to $PREV_IMAGE"
              else
                echo "No previous image recorded — nothing to roll back to."
              fi
              exit 1
            fi
            docker exec vaporzr node -e "$HEALTH_CMD" || true