name: Deploy

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/kobadger/vaporzr/vaporzr-bot
  LIBRESPOT_VERSION: v0.8.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build librespot for linux
        # The Dockerfile does `COPY librespot /usr/local/bin/librespot`. The
        # binary is gitignored (it's a large vendored blob). Upstream ships no
        # prebuilt binaries, so compile the pinned tag from source. As of 0.8.0
        # the pipe + subprocess backends are built unconditionally (not
        # feature-gated), so we trim the build to rustls TLS + libmdns which is
        # all the bot needs for its subprocess/pipe bridge.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          export PATH="$HOME/.cargo/bin:$PATH"
          git clone https://github.com/librespot-org/librespot.git
          cd librespot
          git fetch --depth 1 origin "refs/tags/$LIBRESPOT_VERSION:refs/tags/$LIBRESPOT_VERSION"
          git checkout "$LIBRESPOT_VERSION"
          cargo build --release --bin librespot \
            --no-default-features \
            --features "rustls-tls-webpki-roots,with-libmdns"
          cp target/release/librespot /tmp/librespot
          cd ..
          rm -rf librespot
          mv /tmp/librespot ./librespot
          test -x librespot && ./librespot --version | head -1
          timeout 3 ./librespot --backend ? 2>&1 | grep -E 'pipe|subprocess' || true
        env:
          LIBRESPOT_VERSION: ${{ env.LIBRESPOT_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bot/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}:latest
            docker stop vaporzr || true
            docker rm vaporzr || true
            docker run -d --name vaporzr \
              --restart unless-stopped \
              --env-file /opt/vaporzr/.env \
              -e BIND_ADDRESS=127.0.0.1 \
              -v vaporzr-data:/app/data \
              ${{ env.IMAGE }}:latest
            docker image prune -f
            sleep 5
            docker exec vaporzr node -e "const h=require('http');h.get('http://127.0.0.1:'+(process.env.PORT||4876)+'/health',s=>{process.exit(s.statusCode===200?0:1)}).on('error',()=>process.exit(1))" || echo "WARN: /health not reachable after deploy"