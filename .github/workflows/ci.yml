name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt into the Node 24 action runtime early (GitHub forces it regardless) so
  # the deprecated-Node-20 warnings go away.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  typecheck-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # apps/player is excluded: it typechecks against the untracked Electron fork
      # in vendor/electron-ecs, which is not available on CI runners.
      - name: Typecheck (shared, core, bot, spicetify)
        run: npm run typecheck -w @vaporzr/shared && npm run typecheck -w @vaporzr/core && npm run typecheck -w @vaporzr/bot && npm run typecheck -w @vaporzr/spicetify-app

      - name: Format check
        run: npm run format:check

      - name: Visualizer syntax check
        run: npm run viz:check

      - name: Unit tests (bot)
        working-directory: apps/bot
        run: npm test

      - name: Unit tests (core)
        working-directory: packages/core
        run: npm test

  # The bot's audio stack depends on native Opus, and newer Node ABIs have no
  # upstream prebuild. The root postinstall stages the ABI-agnostic Node 22
  # binding for them, and npm deletes the optional package when its own install
  # script fails - so this job is the only place that exercises "clean install
  # on a Node without prebuilts, from the lockfile". The failure it guards
  # against is silent: install succeeds, voice quietly drops to 64 kbps.
  #
  # It runs on macOS too: opus + ffmpeg-static ship separate darwin binaries,
  # so "works on ubuntu" does not imply "works on macOS".
  audio-stack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audio stack doctor
        run: npm run doctor -- --strict

      - name: Encoder boots
        working-directory: apps/bot
        run: node -e "require('@discordjs/opus'); console.log('native opus loads')"

  # The POSIX process / visualizer / sleep helpers (bot.sh, start-visualizer.sh,
  # stay_awake.sh) are Linux + macOS only; Windows keeps the .ps1/.cmd/.bat trio.
  launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Syntax-check POSIX launchers
        run: |
          for f in bot.sh start-visualizer.sh stay_awake.sh; do
            echo "bash -n $f"; bash -n "$f"
          done

      - name: stay_awake.sh detects the platform without acting
        run: ./stay_awake.sh --check

      - name: bot.sh status is safe when nothing is running
        run: |
          ./bot.sh status
          test ! -f bot.pid   # reporting must not write a pid file
