name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  # Opt into the Node 24 action runtime early (GitHub forces it regardless) so
  # the deprecated-Node-20 warnings go away.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (shared + bot)
        run: npm run typecheck -w @vaporzr/shared && npm run typecheck -w @vaporzr/bot

      - name: Unit tests (bot)
        working-directory: apps/bot
        run: npm test