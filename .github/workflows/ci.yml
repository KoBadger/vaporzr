name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (shared + bot)
        run: npm run typecheck -w @vaporzr/shared && npm run typecheck -w @vaporzr/bot

      - name: Unit tests (bot)
        working-directory: apps/bot
        run: npm test