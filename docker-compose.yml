# vaporzr bot + visualizer (local development)
# Secrets via apps/bot/.env (env_file) -- never enter image or compose file.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  bot:
    # DISABLED BY DEFAULT. The bot runs on the Hetzner VPS; running a local
    # copy at the same time makes both logins fight over the single Discord
    # gateway session (missed events, duplicate replies, voice flapping).
    # Start this local copy ONLY deliberately (and only with the VPS bot
    # stopped) via:
    #   docker compose --profile local-bot up -d
    # A bare `docker compose up` now starts just the visualizer.
    profiles: ['local-bot']
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    image: vaporzr-bot
    container_name: vaporzr_bot_backend
    restart: unless-stopped
    env_file:
      - apps/bot/.env
    ports:
      - '4876:4876'
    volumes:
      - ./apps/bot/data:/app/data
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging

  # Telegram front end. Shares the one queue with the Discord bot: it is a
  # control client, not a second player, so it can be restarted on its own.
  #
  #   docker compose --profile telegram up -d
  #
  # Credentials live in apps/telegram/.env (TELEGRAM_BOT_TOKEN, VAPORZR_KEY).
  # On the VPS the bot publishes 127.0.0.1:4876, so run this container with
  # `--network host` and leave VAPORZR_URL at its default; inside compose the
  # bot is reachable as http://bot:4876.
  telegram:
    profiles: ['telegram']
    image: vaporzr-bot
    container_name: vaporzr_telegram
    restart: unless-stopped
    command: ['tsx', 'apps/telegram/src/main.ts']
    depends_on:
      - bot
    env_file:
      - apps/telegram/.env
    environment:
      VAPORZR_URL: http://bot:4876
      TELEGRAM_STATE_PATH: /app/data/telegram-state.json
    volumes:
      - ./apps/telegram/data:/app/data
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

  visualizer:
    image: nginx:alpine
    container_name: vaporzr_visualizer
    restart: unless-stopped
    ports:
      - '8000:80'
    volumes:
      - ./apps/player/www:/usr/share/nginx/html:ro
    mem_limit: 32m
    cpus: 0.1
    logging: *default-logging
